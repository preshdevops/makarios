name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
        working-directory: android

      - name: Report Build Failures
        if: failure()
        run: |
          echo "### Gradle Build Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 8 -B 2 -E "e: |error:|FAILURE:|FAILED|Exception" android/gradle-build.log | tail -n 80 >> $GITHUB_STEP_SUMMARY || tail -n 60 android/gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "=== GRADLE FAILURE DIAGNOSTICS ==="
          grep -A 8 -B 2 -E "e: |error:|FAILURE:|FAILED|Exception" android/gradle-build.log | tail -n 80 || tail -n 60 android/gradle-build.log

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: makarios-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          retention-days: 7
