name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
        working-directory: android

      - name: Report Build Failures
        if: failure()
        run: |
          echo "=== EXTRACTING BUILD ERRORS ==="
          grep -E "(^e: |[Ee]rror|Caused by:|\* What went wrong:)" android/gradle-build.log | head -n 40 || true
          PASTE_URL=$(curl -s --data-binary @android/gradle-build.log https://paste.rs || echo "")
          if [ -n "$PASTE_URL" ]; then
            echo "::error title=Full Build Log URL::$PASTE_URL"
          fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::error title=Compiler Diagnostic::$line"
            fi
          done < <(grep -E "(^e: |Compilation error|Unresolved reference)" android/gradle-build.log | head -n 20)

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: makarios-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          retention-days: 7
