name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log
        working-directory: android

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log
        working-directory: android

      - name: Report Build Failures
        if: failure()
        run: |
          for log in android/gradle-test.log android/gradle-build.log; do
            if [ -f "$log" ]; then
              echo "=== Failure output from $log ==="
              grep -E "(^e: |Compilation error|FAILED)" "$log" | head -n 30 | while IFS= read -r line; do
                if [ -n "$line" ]; then
                  clean=$(echo "$line" | tr -d '\r' | cut -c 1-200)
                  echo "::error title=$log::$clean"
                fi
              done
              tail -n 25 "$log" | while IFS= read -r line; do
                if [ -n "$line" ]; then
                  clean=$(echo "$line" | tr -d '\r' | cut -c 1-200)
                  echo "::error title=$log::$clean"
                fi
              done
            fi
          done

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: makarios-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: android/*.log
          retention-days: 7
